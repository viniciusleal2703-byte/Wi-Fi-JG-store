<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>JG STORE | Wi-Fi</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#242424 0,#090909 48%,#000 100%);font-family:Arial,Helvetica,sans-serif;color:#fff;padding:24px}
.card{width:min(100%,390px);padding:32px 25px;border:1px solid #333;border-radius:24px;background:linear-gradient(160deg,#171717,#080808);box-shadow:0 24px 70px #000a;text-align:center}
.brand{font-size:13px;letter-spacing:5px;color:#aaa;font-weight:700;margin-bottom:10px}
h1{font-size:32px;letter-spacing:2px;margin:0 0 8px} .sub{color:#aaa;font-size:14px;margin:0 0 26px}
.wifi{border:1px solid #333;border-radius:16px;padding:18px;margin-bottom:18px;background:#111}
.label{font-size:11px;letter-spacing:2px;color:#888;text-transform:uppercase;margin-bottom:8px}
.ssid{font-size:22px;font-weight:700;letter-spacing:.5px}
.pass{font-size:17px;letter-spacing:1px;margin-top:12px;color:#ddd;word-break:break-word}
button{width:100%;border:0;border-radius:12px;padding:15px 18px;background:#fff;color:#000;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
button.secondary{background:#242424;color:#fff;border:1px solid #444}
.qrwrap{background:#fff;border-radius:14px;padding:12px;width:176px;margin:22px auto 12px}
.qrwrap img{display:block;width:100%;height:auto}
.hint{font-size:12px;line-height:1.5;color:#999;margin:12px 4px 0}
.footer{font-size:10px;letter-spacing:2px;color:#666;margin-top:25px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">JG STORE</div>
  <h1>WI-FI</h1>
  <p class="sub">Conecte-se à nossa rede</p>
  <section class="wifi">
    <div class="label">Nome da rede</div>
    <div class="ssid">Casa Dias</div>
    <div class="label" style="margin-top:18px">Senha</div>
    <div class="pass" id="password">Casadias2006</div>
  </section>
  <button onclick="copyPassword()">COPIAR SENHA</button>
  <div class="qrwrap"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAEIAQAAAACLjVdSAAABjElEQVR4nO2ZsRLDMAhD9Xr5/19WBzDx1qmEq5shdV0Nqs6AwFgfntcnwB/xw4hLIlbGkoSFce2OYdqmh0IHxduS5W13CtNGBCDJLE3yM76PYtqJwMYSUkXLIzweRVz30kSMmAyWTh5TEJdU/94Iy1jg2p3CtE+PDI6qL8LU7himbXpUbBBlxVR56eMxCIFAgMVSIfwH4sx6q8oWVM2NqPE0pt9GXJIjXZhcpR9bGWQK0x4Ezgy6gkSSt9Q6h2nn+VA49VzEQwoyhWnb+ahXRItMtnadPKYgwn/g7FpWqOjU/nYljlIhU6lrcwrTPoRZfkN29rd5Ys70H1txyRZGluwzz0dNgtKmI+zwpmf6MSGirQ2jms2cYxQyhWkf4p4ALS24p2SjmH4fseanllD4di2/Gr9MYdqmRzkNs0Zk6U3Nifljk+CW4+D5R83Xo8uXsQWkORvFtBNBOA7SmWXdmci0C4Egph8xaH+Kx4OIbb6+LiyVVw6cmE+3m9qt9c+NA/3pPul4kscfMRPxBrATnTmTT5piAAAAAElFTkSuQmCC" alt="QR Code para conectar ao Wi-Fi"></div>
  <p class="hint">Aponte a câmera do celular para o QR Code para conectar à rede. Em alguns aparelhos, será necessário tocar na notificação exibida.</p>
  <button class="secondary" onclick="copyNetwork()">COPIAR NOME DA REDE</button>
  <div class="footer">JG STORE • CONEXÃO WI-FI</div>
</main>
<script>
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(()=>alert('Copiado!')).catch(()=>fallback(text));
  } else fallback(text);
}
function fallback(text) {
  const el=document.createElement('textarea'); el.value=text; document.body.appendChild(el); el.select();
  try { document.execCommand('copy'); alert('Copiado!'); } catch(e) { alert('Não foi possível copiar.'); }
  el.remove();
}
function copyPassword() { copyText('Casadias2006'); }
function copyNetwork() { copyText('Casa Dias'); }
</script>
</body>
</html>
